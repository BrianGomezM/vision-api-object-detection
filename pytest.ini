[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    live_smoke: LIVE_SMOKE_TEST — proveedores REALES (YOLO/Groq/Gemini). Manual; nunca en CI.
    entorno_referencia: regresión byte a byte; requiere el entorno de referencia (requirements.lock.txt, Windows). Se excluye en CI.
filterwarnings =
    ignore::DeprecationWarning
