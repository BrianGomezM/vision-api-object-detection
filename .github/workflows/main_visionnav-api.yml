# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Despliegue basado en contenedor Docker (no Oryx/código). La imagen se
# construye y publica UNA vez aquí, con las libs de sistema (libxcb1, etc.)
# y las dependencias Python (torch/ultralytics) ya horneadas — así Azure
# solo arranca el contenedor en cada restart, sin apt-get ni pip install
# en runtime. Ver Dockerfile para el detalle de cada capa.

name: Build and deploy Python app to Azure Web App - visionnav-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image-name
        # Los registros OCI exigen nombres en minúsculas; el owner de GitHub
        # puede tener mayúsculas (p. ej. BrianGomezM), así que se normaliza aquí.
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vision-api-object-detection" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:latest
            ${{ steps.image-name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38B21B9A26EC4502BE8F1358F5327135 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_088A1442A3B64F709EAF0870CC02CB1B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_97685B77594A402D9D8F4357A17E92BB }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'visionnav-api'
          slot-name: 'Production'
          images: '${{ needs.build.outputs.image }}:${{ github.sha }}'
