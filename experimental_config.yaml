    decodificacion: PIL Image.open(...).convert('RGB') — descarta alfa; orientación EXIF NO se aplica
    regla: 'si max(ancho, alto) > 800: escalar a 800 px en el lado mayor (int(dim*r)), filtro LANCZOS, re-codificar
      JPEG calidad 90 (submuestreo 4:2:0 por defecto de Pillow); si no, se pasan los bytes ORIGINALES'
    dataset1: 800 px → sin redimensionar ni re-codificar (bytes idénticos, verificado)
  paso_2_run_yolo: PIL Image.open(bytes).convert('RGB') → model.predict(source=PIL)
  paso_3_ultralytics:
    conversion: PIL RGB → numpy BGR (LoadPilAndNumpy) → RGB, /255, float32, BCHW
    letterbox:
      imgsz: 1280
      rect: true
      auto: true
      stride: 32
      interpolacion: cv2.INTER_LINEAR
      relleno: 114
      centrado: true
      scaleup: true
