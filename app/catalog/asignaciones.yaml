# Asignación de ESTÍMULOS a las pruebas de usuario (Objetivo Específico 3).
#
# Por qué está fuera de catalog.yaml: catalog.yaml está congelado (sha256 en
# experimental_config.yaml). Este archivo solo resuelve las pruebas que el catálogo
# deja en POR_DEFINIR; si el catálogo ya define los estímulos de una prueba, manda el
# catálogo. No cambia la detección, la narrativa ni el TTS.
#
# Estudio v2 (2026-10-10): escenas E1–E5 (stimuli/estudio2) con más objetos, tras la sesión de
# prueba con la profesora. Antes (2026-09-29) se usaban escenas del Dataset 1 de dos objetos.
# Un estímulo por prueba: todos los participantes (objetivo y piloto) escuchan la
# misma escena en la misma prueba, para que sus respuestas sean comparables.
#
# Criterio de selección del estudio v2 (revisión previa con scripts/study/check_scenes.py,
# 2026-10-10): escenas del bloque E en las que el detector encuentra los objetos del diseño y la
# narrativa no repite objetos; E3 y E4 con una sola salida libre que la narrativa indica. Se
# descartaron variantes en las que el sofá lejano se detectaba también como «banco». En E3/E4
# la maceta del fondo se detecta también como «jarrón» y en E5 la narrativa no menciona a las
# personas del fondo: son resultados del sistema y la referencia es la narrativa congelada.
#
# estimulos: lista de stimulus_id (del manifest) o null (la prueba no usa estímulo:
# se pregunta sobre lo escuchado en la sesión).
# referencia: respuesta según la NARRATIVA CONGELADA (stimuli/estudio2/audios/congelados.yaml),
# no según la imagen. Permite que el investigador marque sin transcribir. Narrativas del 2026-10-10:
#   E1: «Silla a tu izquierda a aproximadamente 4 pasos. Sofá a tu derecha a aproximadamente
#        4 pasos. 2 personas frente a ti a aproximadamente 5 y 6 pasos.» → la más lejana: personas.
#   E2: «Persona cerca a tu izquierda a aproximadamente 2 pasos. Sofá … a tu derecha a
#        aproximadamente 5 pasos.»
#   E3 → «Puedes avanzar hacia la izquierda»; E4 → «Silla a tu izquierda … Puedes avanzar hacia
#        la derecha»: entre E3 y E4 la narrativa solo cambia la silla y la salida.

schema_version: 1

asignaciones:
  - prueba_id: OBJ-01            # objetos de la escena y cuál está más lejos
    estimulos: [EST2-E1]         # silla, sofá y dos personas
    referencia:
      objetos:
        - {nombre: Silla, lado: izquierda, pasos: 4}
        - {nombre: Sofá, lado: derecha, pasos: 4}
        - {nombre: Personas, lado: frente, pasos: 5}
      relacion: {pregunta: "De esos objetos, ¿cuál está más lejos de usted?", respuesta: Personas}
  - prueba_id: OBJ-02            # dónde está cada objeto (dos objetos)
    estimulos: [EST2-E2]         # persona cerca a la izquierda, sofá lejos a la derecha
    referencia:
      objetos:
        - {nombre: Persona, articulo: la persona, lado: izquierda, pasos: 2}
        - {nombre: Sofá, articulo: el sofá, lado: derecha, pasos: 5}
  - prueba_id: OBJ-03            # por dónde puede avanzar
    estimulos: [EST2-E3]         # sala: frente y derecha bloqueados de cerca → izquierda libre
    referencia: {direccion_narrativa: izquierda}
  - prueba_id: OBJ-04            # qué cambió en la sala
    estimulos: [EST2-E4]         # la misma sala con la silla a la izquierda → derecha libre
    referencia:
      direccion_narrativa: derecha
      cambios:
        - "La silla pasó de la derecha a la izquierda"
        - "Ahora se puede avanzar por la derecha (antes, por la izquierda)"
  - prueba_id: OBJ-05            # cómo suena la voz
    estimulos: [EST2-E5]         # cuatro objetos
  - prueba_id: OBJ-06            # información suficiente (sobre lo escuchado)
    estimulos: null
  - prueba_id: OBJ-07            # utilidad (cierre)
    estimulos: null

# Escena de PRÁCTICA: familiariza al participante con la voz y el formato antes de OBJ-01. Se
# registra como ensayo (no es evidencia) y no está asignada a ninguna prueba.
#   EST2-E6 (v4, 2026-10-10): comedor con mesa, sillas, jarrón, tazón, planta, televisor y reloj.
#   Antes: DS1-A2 (una silla a la izquierda), que sigue en el catálogo y en los audios congelados.
practica: [EST2-E6]
