# Catálogo ÚNICO de pruebas — fuente de verdad para backend y cliente (F3).
#
# Qué contiene:
#   - metricas:        identificadores de las métricas planificadas. Su DEFINICIÓN
#                      operativa (criterio, umbral, agregación) está POR DEFINIR en
#                      el CHECKPOINT 3B; aquí solo se referencian.
#   - datasets:        conjuntos de estímulos. Las imágenes y hashes de cada dataset
#                      se leen de su manifest (p. ej. stimuli/dataset1/manifest.yaml).
#   - pruebas_tecnicas: plantillas por bloque (A–D) del Dataset 1. Cada estímulo del
#                      bloque genera una prueba "<plantilla>-<scene_id>" (p. ej. TEC-A-A1).
#   - pruebas_usuario: tareas del estudio con usuarios (antes en el cliente,
#                      lib/study-tests.ts), con el guion del investigador.
#
# Qué NO contiene: ground truth ni condiciones de diseño de los estímulos. Esas viven
# solo en el manifest del dataset y el servidor NO las envía al cliente.
#
# disponibilidad.investigador / disponibilidad.participante: si la prueba (y su
# texto informativo del ícono (!)) puede mostrarse en la vista del investigador o en
# la del participante. El ícono (!) es solo de la vista del investigador.

schema_version: 1

metricas:
  - {id: M-DET,    nombre: "Detección por objeto (TP/FP/FN)",               estado: POR_DEFINIR_CP3B}
  - {id: M-LOC,    nombre: "Localización (IoU caja predicha vs. GT)",        estado: POR_DEFINIR_CP3B}
  - {id: M-HOR,    nombre: "Posición horizontal (izquierda/centro/derecha)", estado: POR_DEFINIR_CP3B}
  - {id: M-PROF,   nombre: "Profundidad (cerca/medio/lejos)",                estado: POR_DEFINIR_CP3B}
  - {id: M-REL,    nombre: "Relaciones espaciales entre objetos",            estado: POR_DEFINIR_CP3B}
  - {id: M-NAR,    nombre: "Fidelidad de la narrativa respecto a la detección", estado: POR_DEFINIR_CP3B}
  - {id: M-USR-ID, nombre: "Identificación de objetos por el participante",  estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-USR-ESP, nombre: "Relación espacial reportada por el participante", estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-USR-RUTA, nombre: "Elección de ruta por el participante",         estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-USR-SUBJ, nombre: "Valoraciones subjetivas (escala 1–5)",         estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-PIL,    nombre: "Validación del instrumento (piloto)",            estado: DEFINIDA_EVALUACION_USUARIOS}

datasets:
  - id: dataset1
    nombre: "Dataset 1 — escenas geométricas controladas A1–D3"
    manifest: stimuli/dataset1/manifest.yaml
    estado: FROZEN_V1
    descripcion: >-
      18 escenas sintéticas con cámara, posiciones horizontales y profundidades
      controladas. Condición geométrica conocida por diseño (generador, commit ae85f90).
  - id: dataset2
    nombre: "Dataset 2 — variabilidad visual (robustez)"
    manifest: null
    estado: PENDIENTE_SELECCION_Y_LICENCIA
    descripcion: >-
      Conjunto de robustez / variabilidad visual. Sin imágenes integradas: la selección
      y la verificación de licencias están pendientes. No tiene ground truth 3D.

pruebas_tecnicas:
  - id: TEC-A
    bloque: A
    dataset: dataset1
    nombre: "Bloque A — un objeto: posición horizontal × profundidad"
    objetivo: >-
      Verificar si el sistema detecta un único objeto (silla) y reporta su posición
      horizontal y su profundidad en las 9 combinaciones controladas (3 × 3).
    descripcion: >-
      Una silla en izquierda, centro o derecha, a distancia cerca, media o lejos.
      Aísla el efecto de la posición y la distancia sin otros objetos en la escena.
    metricas: [M-DET, M-LOC, M-HOR, M-PROF, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}
  - id: TEC-B
    bloque: B
    dataset: dataset1
    nombre: "Bloque B — dos objetos lado a lado"
    objetivo: >-
      Verificar la detección de dos objetos a la misma profundidad y si el sistema
      distingue su posición horizontal relativa.
    descripcion: >-
      Pares de objetos (silla–mesa, sofá–planta, persona–botella) separados
      horizontalmente, a distancia media y sin oclusión.
    metricas: [M-DET, M-LOC, M-HOR, M-REL, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}
  - id: TEC-C
    bloque: C
    dataset: dataset1
    nombre: "Bloque C — relaciones delante de / al lado de"
    objetivo: >-
      Verificar la detección y la descripción de relaciones espaciales cuando un
      objeto está delante de otro (con oclusión parcial) o junto a él.
    descripcion: >-
      Silla delante de mesa, sofá al lado de planta y persona delante de mesa, a
      distancia media. La oclusión está cuantificada por diseño.
    metricas: [M-DET, M-LOC, M-HOR, M-REL, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}
  - id: TEC-D
    bloque: D
    dataset: dataset1
    nombre: "Bloque D — escenas con varios objetos"
    objetivo: >-
      Verificar la detección y la descripción de escenas con tres o cuatro objetos,
      incluidos objetos apoyados sobre otros.
    descripcion: >-
      Tres o cuatro objetos a distancia media (p. ej. silla, mesa y planta; portátil y
      botella sobre la mesa). Evalúa completitud y orden de la narrativa.
    metricas: [M-DET, M-LOC, M-HOR, M-REL, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}

# Tareas del estudio con usuarios (Objetivo Específico 3).
# Revisadas el 2026-10-01 (doc. 34 de la carpeta claude), antes de cualquier sesión con
# participantes reales: guiones literales, una pregunta por constructo y el campo
# "codificacion" (qué se codifica de la respuesta). Ver docs/EVALUACION_USUARIOS.md §0.
#   codificacion: objetos    → ¿nombró cada objeto de la narrativa? (omisiones, invenciones)
#                 relaciones → ¿comprendió las relaciones entre objetos de la narrativa?
#                 ubicacion  → ¿el lado que dijo coincide con el de la narrativa?
#                 distancia  → ¿la distancia que dijo coincide con la de la narrativa?
#                 cambio     → ¿percibió el cambio entre dos escenas consecutivas?
# La referencia de toda la codificación es la NARRATIVA escuchada (Ref-N), no la imagen.
# Los estímulos quedan pendientes aquí y se asignan en asignaciones.yaml.
pruebas_usuario:
  - id: OBJ-01
    pista: objetivo
    nombre: "Identificación de objetos y relación entre ellos"
    objetivo: "Medir qué proporción de los objetos mencionados en la narrativa recuerda el participante, si menciona objetos que la narrativa no dijo y si comprende la relación espacial entre ellos."
    guion_investigador: 'Reproduce el audio una vez. Cuando termine, pregunta: "¿Qué objetos mencionó la descripción?". Anota la respuesta tal cual, sin corregir ni dar pistas. Después pregunta: "¿Cómo están ubicados esos objetos entre sí?". Repite el audio solo si el participante lo pide y registra cada aclaración que solicite.'
    tipo: imagen
    codificacion: [objetos, relaciones]
    metricas: [M-USR-ID, M-USR-ESP]
    metricas_texto: ["% de objetos de la narrativa identificados", "objetos omitidos", "objetos inventados", "% de relaciones comprendidas"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-02
    pista: objetivo
    nombre: "Ubicación egocéntrica de un objeto"
    objetivo: "Medir si el participante ubica un objeto respecto a sí mismo (izquierda, frente o derecha) y a qué distancia, tal como lo indicó la narrativa."
    guion_investigador: 'Reproduce el audio una vez. Cuando termine, pregunta: "¿Dónde se encuentra la silla respecto a usted: a su izquierda, al frente o a su derecha?". Después pregunta: "¿Aproximadamente a qué distancia está?". Repite el audio solo si el participante lo pide.'
    tipo: imagen
    codificacion: [ubicacion, distancia]
    metricas: [M-USR-ESP]
    metricas_texto: ["ubicación coincidente con la narrativa", "distancia coincidente con la narrativa", "repeticiones de audio"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-03
    pista: objetivo
    nombre: "Decisión de dirección"
    objetivo: "Evaluar si el participante comprende la indicación de movimiento de la narrativa y elige la dirección que esta indica. Como capa aparte se compara su elección con la dirección libre según el diseño de la escena."
    guion_investigador: 'Reproduce el audio una vez. Cuando termine, pregunta: "Según lo que escuchó, ¿hacia dónde avanzaría: hacia la izquierda, al frente o hacia la derecha?". Registra la opción que elija; si no elige ninguna, registra "No responde". Repite el audio solo si el participante lo pide.'
    tipo: ruta
    codificacion: []
    metricas: [M-USR-RUTA]
    metricas_texto: ["elección coincidente con la instrucción narrada", "elección coincidente con el diseño de la escena", "repeticiones de audio"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-04
    pista: objetivo
    nombre: "Actualización de contexto"
    objetivo: "Evaluar si el participante percibe que la disposición de los objetos cambió respecto a la escena anterior y qué dirección elige con la nueva descripción."
    guion_investigador: 'Inmediatamente después de OBJ-03, reproduce el audio de la segunda escena sin anunciar que hubo un cambio. Primero pregunta: "¿Notó algo distinto respecto a la descripción anterior?" y registra la respuesta. Después pregunta: "Según lo que escuchó ahora, ¿hacia dónde avanzaría: hacia la izquierda, al frente o hacia la derecha?".'
    tipo: ruta
    codificacion: [cambio]
    metricas: [M-USR-RUTA]
    metricas_texto: ["percepción del cambio", "elección coincidente con la instrucción narrada", "elección coincidente con el diseño de la escena"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-05
    pista: objetivo
    nombre: "Calidad de la voz (independiente del contenido)"
    objetivo: "Medir la calidad percibida de la voz sintética del estudio, separada de la comprensión del contenido. Se usa una narrativa corta del propio sistema, porque la voz evaluada es la del sistema."
    guion_investigador: 'Reproduce el audio una vez. Indica: "Ahora no le preguntaré por lo que dijo la voz, sino por cómo sonó". Para cada criterio lee la pregunta y las cinco opciones (1 nada, 2 poco, 3 moderadamente, 4 bastante, 5 muy) y registra el número.'
    tipo: escala
    criterios: [inteligibilidad, velocidad, naturalidad, volumen]
    codificacion: []
    metricas: [M-USR-SUBJ]
    metricas_texto: ["inteligibilidad", "velocidad percibida", "naturalidad", "comodidad del volumen"]
    tipo_evaluacion: usuario_subjetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-06
    pista: objetivo
    nombre: "Suficiencia de la información"
    objetivo: "Determinar si el participante percibe la cantidad de información de las descripciones como suficiente y si le parecieron repetitivas."
    guion_investigador: 'Pregunta, pensando en todas las descripciones que escuchó: "¿Qué tan suficiente fue la información para hacerse una idea del lugar?" y "¿Qué tan repetitivas le parecieron?". Lee las cinco opciones (1 nada, 2 poco, 3 moderadamente, 4 bastante, 5 muy). Después pregunta: "¿Faltó algo? ¿Sobró algo?" y anota la respuesta en los comentarios.'
    tipo: escala
    criterios: [suficiencia, redundancia]
    codificacion: []
    metricas: [M-USR-SUBJ]
    metricas_texto: ["suficiencia de información", "redundancia percibida"]
    tipo_evaluacion: usuario_subjetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-07
    pista: objetivo
    nombre: "Utilidad percibida"
    objetivo: "Obtener una valoración global de la utilidad de las descripciones y comentarios espontáneos."
    guion_investigador: 'Pregunta: "En general, ¿qué tan útiles le parecen estas descripciones para orientarse en un espacio que no conoce?" y lee las cinco opciones (1 nada, 2 poco, 3 moderadamente, 4 bastante, 5 muy). Después pregunta: "¿Por qué?" y anota la respuesta en los comentarios.'
    tipo: escala
    criterios: [utilidad_general]
    codificacion: []
    metricas: [M-USR-SUBJ]
    metricas_texto: ["utilidad percibida"]
    tipo_evaluacion: usuario_subjetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: PIL-01
    pista: piloto
    nombre: "Comprensión de las instrucciones"
    objetivo: "Verificar que las instrucciones del estudio se entienden sin ambigüedad antes de aplicarlas a la población objetivo."
    guion_investigador: 'Al terminar las actividades, pregunta: "Desde el inicio, ¿qué tan claro le quedó lo que se le iba a pedir en cada actividad?" y lee las cinco opciones (1 nada, 2 poco, 3 moderadamente, 4 bastante, 5 muy). Anota en los comentarios qué instrucción no quedó clara, si la hubo.'
    tipo: escala
    criterios: [claridad_instrucciones]
    codificacion: []
    metricas: [M-PIL]
    metricas_texto: ["validación de instrucciones (no es evidencia de accesibilidad)"]
    tipo_evaluacion: piloto_instrumento
    estimulos: null
    disponibilidad: {investigador: true, participante: false}
  - id: PIL-02
    pista: piloto
    nombre: "Duración de la sesión"
    objetivo: "Comparar la duración percibida con la duración real de la sesión (registrada por el sistema) y con los 30 minutos que indica el consentimiento."
    guion_investigador: 'Pregunta: "¿La duración de la sesión le pareció corta, adecuada o larga?". Anota la opción y el motivo. La duración real la calcula el sistema al finalizar la sesión.'
    tipo: texto
    codificacion: []
    metricas: [M-PIL]
    metricas_texto: ["duración percibida", "duración real"]
    tipo_evaluacion: piloto_instrumento
    estimulos: null
    disponibilidad: {investigador: true, participante: false}
  - id: PIL-03
    pista: piloto
    nombre: "Comprensión de las escalas y las preguntas"
    objetivo: "Verificar que el participante entiende las escalas de 1 a 5 leídas en voz alta y las preguntas de cada actividad."
    guion_investigador: 'Pregunta: "¿Qué tan fácil le resultó responder con números del 1 al 5?" y lee las cinco opciones (1 nada, 2 poco, 3 moderadamente, 4 bastante, 5 muy). Después pregunta: "¿Alguna pregunta de las actividades le pareció confusa? ¿Cuál?" y anota la respuesta en los comentarios.'
    tipo: escala
    criterios: [comprension_escalas]
    codificacion: []
    metricas: [M-PIL]
    metricas_texto: ["comprensión de las escalas", "preguntas confusas"]
    tipo_evaluacion: piloto_instrumento
    estimulos: null
    disponibilidad: {investigador: true, participante: false}
  - id: PIL-04
    pista: piloto
    nombre: "Claridad del formulario y el consentimiento"
    objetivo: "Confirmar que el formulario de registro y el texto de consentimiento se entienden sin apoyo adicional."
    guion_investigador: 'Pregunta: "¿Hubo alguna parte del formulario o del consentimiento que no le quedara clara?". Anota la respuesta tal cual.'
    tipo: texto
    codificacion: []
    metricas: [M-PIL]
    metricas_texto: ["validación de instrumentos de consentimiento"]
    tipo_evaluacion: piloto_instrumento
    estimulos: null
    disponibilidad: {investigador: true, participante: false}
  - id: PIL-05
    pista: piloto
    nombre: "Comentario general"
    objetivo: "Recoger observaciones libres sobre la sesión antes de aplicarla a la población objetivo."
    guion_investigador: 'Pregunta abierta de cierre: "¿Hay algo que deberíamos ajustar antes de hacer esta actividad con las personas participantes?". Anota la respuesta tal cual.'
    tipo: texto
    codificacion: []
    metricas: [M-PIL]
    metricas_texto: ["mejora del instrumento"]
    tipo_evaluacion: piloto_instrumento
    estimulos: null
    disponibilidad: {investigador: true, participante: false}
