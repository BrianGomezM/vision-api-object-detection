# Catálogo ÚNICO de pruebas — fuente de verdad para backend y cliente (F3).
#
# Qué contiene:
#   - metricas:        identificadores de las métricas planificadas. Su DEFINICIÓN
#                      operativa (criterio, umbral, agregación) está POR DEFINIR en
#                      el CHECKPOINT 3B; aquí solo se referencian.
#   - datasets:        conjuntos de estímulos. Las imágenes y hashes de cada dataset
#                      se leen de su manifest (p. ej. stimuli/dataset1/manifest.yaml).
#   - pruebas_tecnicas: plantillas por bloque (A–D) del Dataset 1. Cada estímulo del
#                      bloque genera una prueba "<plantilla>-<scene_id>" (p. ej. TEC-A-A1).
#   - pruebas_usuario: tareas del estudio con usuarios (antes en el cliente,
#                      lib/study-tests.ts), con el guion del investigador.
#
# Qué NO contiene: ground truth ni condiciones de diseño de los estímulos. Esas viven
# solo en el manifest del dataset y el servidor NO las envía al cliente.
#
# disponibilidad.investigador / disponibilidad.participante: si la prueba (y su
# texto informativo del ícono (!)) puede mostrarse en la vista del investigador o en
# la del participante. El ícono (!) es solo de la vista del investigador.

schema_version: 1

metricas:
  - {id: M-DET,    nombre: "Detección por objeto (TP/FP/FN)",               estado: POR_DEFINIR_CP3B}
  - {id: M-LOC,    nombre: "Localización (IoU caja predicha vs. GT)",        estado: POR_DEFINIR_CP3B}
  - {id: M-HOR,    nombre: "Posición horizontal (izquierda/centro/derecha)", estado: POR_DEFINIR_CP3B}
  - {id: M-PROF,   nombre: "Profundidad (cerca/medio/lejos)",                estado: POR_DEFINIR_CP3B}
  - {id: M-REL,    nombre: "Relaciones espaciales entre objetos",            estado: POR_DEFINIR_CP3B}
  - {id: M-NAR,    nombre: "Fidelidad de la narrativa respecto a la detección", estado: POR_DEFINIR_CP3B}
  - {id: M-USR-ID, nombre: "Identificación de objetos por el participante",  estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-USR-ESP, nombre: "Relación espacial reportada por el participante", estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-USR-RUTA, nombre: "Elección de ruta por el participante",         estado: DEFINIDA_EVALUACION_USUARIOS}
  - {id: M-USR-SUBJ, nombre: "Valoraciones subjetivas (escala 1–5)",         estado: DEFINIDA_EVALUACION_USUARIOS}

datasets:
  - id: dataset1
    nombre: "Dataset 1 — escenas geométricas controladas A1–D3"
    manifest: stimuli/dataset1/manifest.yaml
    estado: FROZEN_V1
    descripcion: >-
      18 escenas sintéticas con cámara, posiciones horizontales y profundidades
      controladas. Condición geométrica conocida por diseño (generador, commit ae85f90).
  - id: estudio2
    nombre: "Estudio con usuarios v2 — escenas E1–E6"
    manifest: stimuli/estudio2/manifest.yaml
    estado: ESTUDIO_V2
    descripcion: >-
      Seis escenas de interiores del mismo generador (2026-10-11), con entre 6 y 11 objetos
      y un corredor libre verificado: comedor (práctica), oficina, cocina-comedor, dos
      versiones de una sala de estar (una sola salida libre y los objetos movidos) y dormitorio.
  - id: dataset2
    nombre: "Dataset 2 — variabilidad visual (robustez)"
    manifest: null
    estado: PENDIENTE_SELECCION_Y_LICENCIA
    descripcion: >-
      Conjunto de robustez / variabilidad visual. Sin imágenes integradas: la selección
      y la verificación de licencias están pendientes. No tiene ground truth 3D.

pruebas_tecnicas:
  - id: TEC-A
    bloque: A
    dataset: dataset1
    nombre: "Bloque A — un objeto: posición horizontal × profundidad"
    objetivo: >-
      Verificar si el sistema detecta un único objeto (silla) y reporta su posición
      horizontal y su profundidad en las 9 combinaciones controladas (3 × 3).
    descripcion: >-
      Una silla en izquierda, centro o derecha, a distancia cerca, media o lejos.
      Aísla el efecto de la posición y la distancia sin otros objetos en la escena.
    metricas: [M-DET, M-LOC, M-HOR, M-PROF, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}
  - id: TEC-B
    bloque: B
    dataset: dataset1
    nombre: "Bloque B — dos objetos lado a lado"
    objetivo: >-
      Verificar la detección de dos objetos a la misma profundidad y si el sistema
      distingue su posición horizontal relativa.
    descripcion: >-
      Pares de objetos (silla–mesa, sofá–planta, persona–botella) separados
      horizontalmente, a distancia media y sin oclusión.
    metricas: [M-DET, M-LOC, M-HOR, M-REL, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}
  - id: TEC-C
    bloque: C
    dataset: dataset1
    nombre: "Bloque C — relaciones delante de / al lado de"
    objetivo: >-
      Verificar la detección y la descripción de relaciones espaciales cuando un
      objeto está delante de otro (con oclusión parcial) o junto a él.
    descripcion: >-
      Silla delante de mesa, sofá al lado de planta y persona delante de mesa, a
      distancia media. La oclusión está cuantificada por diseño.
    metricas: [M-DET, M-LOC, M-HOR, M-REL, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}
  - id: TEC-D
    bloque: D
    dataset: dataset1
    nombre: "Bloque D — escenas con varios objetos"
    objetivo: >-
      Verificar la detección y la descripción de escenas con tres o cuatro objetos,
      incluidos objetos apoyados sobre otros.
    descripcion: >-
      Tres o cuatro objetos a distancia media (p. ej. silla, mesa y planta; portátil y
      botella sobre la mesa). Evalúa completitud y orden de la narrativa.
    metricas: [M-DET, M-LOC, M-HOR, M-REL, M-NAR]
    tipo_evaluacion: tecnica_automatica
    disponibilidad: {investigador: true, participante: false}

# Tareas del estudio con usuarios (Objetivo Específico 3).
# Desde el 2026-10-09 el estudio se aplica SOLO a participantes objetivo (decisión de los
# directores): se retiraron la prueba piloto y sus preguntas PIL-01…05.
# Estudio v2 (2026-10-10), tras la sesión de prueba con la profesora:
#   - Escenas nuevas (stimuli/estudio2, E1–E5) con más objetos: las anteriores tenían dos
#     objetos, se repetían y no permitían reconocer el lugar.
#   - Cada prueba sigue el mismo orden: «le pondré un audio, escúchelo con atención; al
#     terminar le haré unas preguntas». Preguntas cortas y en lenguaje cotidiano.
#   - El investigador ya no transcribe (la respuesta queda grabada): marca respuestas
#     definidas de antemano según la narrativa (referencia en asignaciones.yaml).
#   - OBJ-03/OBJ-04 admiten varias direcciones (por dónde podría avanzar).
#   codificacion: objetos    → ¿nombró cada objeto de la narrativa? (omisiones, invenciones)
#                 relaciones → ¿respondió bien la pregunta de relación (objeto más lejano)?
#                 ubicacion  → ¿el lado que dijo coincide con el de la narrativa?
#                 distancia  → ¿la distancia que dijo coincide con la de la narrativa?
#                 cambio     → ¿percibió los cambios entre dos escenas consecutivas?
# La referencia de toda la codificación es la NARRATIVA escuchada (Ref-N), no la imagen.
# Escala de todas las valoraciones: 1 nada, 2 poco, 3 más o menos, 4 bastante, 5 mucho.
pruebas_usuario:
  - id: OBJ-01
    pista: objetivo
    nombre: "Objetos de la escena y cuál está más lejos"
    objetivo: "Saber cuántos de los objetos de la descripción recuerda el participante, si menciona objetos que no estaban y si identifica cuál está más lejos de él."
    guion_investigador: 'Diga: "Le pondré un audio. Escúchelo con atención; al terminar le haré unas preguntas." Reproduzca el audio una vez. Pregunte: "¿Qué objetos mencionó la descripción?" y marque cada objeto que nombre. Después pregunte: "De esos objetos, ¿cuál está más lejos de usted?". Repita el audio solo si el participante lo pide.'
    tipo: imagen
    codificacion: [objetos, relaciones]
    metricas: [M-USR-ID, M-USR-ESP]
    metricas_texto: ["objetos recordados de la descripción", "objetos mencionados que no estaban", "acierta el objeto más lejano"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-02
    pista: objetivo
    nombre: "Dónde está cada objeto"
    objetivo: "Saber si el participante ubica cada objeto respecto a sí mismo (izquierda, al frente o derecha) y a cuántos pasos, tal como lo dijo la descripción."
    guion_investigador: 'Diga: "Le pondré otro audio. Escúchelo con atención; al terminar le haré unas preguntas." Reproduzca el audio una vez. Para cada objeto pregunte: "¿Dónde está [objeto]: a su izquierda, al frente o a su derecha?" y "¿A cuántos pasos, más o menos?". Repita el audio solo si el participante lo pide.'
    tipo: imagen
    codificacion: [ubicacion, distancia]
    metricas: [M-USR-ESP]
    metricas_texto: ["lado coincidente con la descripción", "pasos coincidentes con la descripción (±1)", "repeticiones del audio"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-03
    pista: objetivo
    nombre: "Por dónde puede avanzar"
    objetivo: "Saber si el participante identifica por dónde podría avanzar sin chocar, según la descripción. Se compara con la dirección que indicó la descripción y con las direcciones libres según el diseño de la escena."
    guion_investigador: 'Diga: "Ahora escuchará la descripción de una sala. Escúchela con atención; al terminar le haré una pregunta." Reproduzca el audio una vez. Pregunte: "Según lo que escuchó, ¿por dónde podría avanzar sin chocar: por la izquierda, al frente o por la derecha? Puede decir más de una." Marque todas las que diga.'
    tipo: ruta
    codificacion: []
    metricas: [M-USR-RUTA]
    metricas_texto: ["elige solo las direcciones libres", "elige alguna dirección bloqueada", "elige la dirección que indicó la descripción"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-04
    pista: objetivo
    nombre: "Qué cambió en la sala"
    objetivo: "Saber si el participante actualiza su idea del lugar cuando la descripción cambia: si nota que los objetos se movieron y si cambia la dirección por la que avanzaría."
    guion_investigador: 'Inmediatamente después de OBJ-03 diga: "Le pondré la descripción de la misma sala un momento después. Escúchela con atención." Reproduzca el audio una vez, sin anunciar qué cambió. Pregunte: "¿Notó algún cambio respecto a la descripción anterior?"; si dice que sí: "¿Qué cambió?". Después pregunte: "Y ahora, ¿por dónde podría avanzar sin chocar: por la izquierda, al frente o por la derecha? Puede decir más de una."'
    tipo: ruta
    codificacion: [cambio]
    metricas: [M-USR-RUTA]
    metricas_texto: ["nota el cambio", "cambios reales que menciona", "elige solo las direcciones libres de la nueva escena"]
    tipo_evaluacion: usuario_objetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-05
    pista: objetivo
    nombre: "Cómo suena la voz"
    objetivo: "Conocer cómo percibe el participante la voz del sistema (claridad, ritmo, parecido a una persona y volumen), aparte del contenido."
    guion_investigador: 'Diga: "Le pondré un último audio. Esta vez le preguntaré por cómo suena la voz, no por lo que dice." Reproduzca el audio una vez. Haga cada pregunta y lea siempre las opciones: 1 nada, 2 poco, 3 más o menos, 4 bastante, 5 mucho.'
    tipo: escala
    criterios: [inteligibilidad, velocidad, naturalidad, volumen]
    codificacion: []
    metricas: [M-USR-SUBJ]
    metricas_texto: ["facilidad para entender la voz", "ritmo cómodo", "parecido a una persona", "volumen cómodo"]
    tipo_evaluacion: usuario_subjetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-06
    pista: objetivo
    nombre: "Información suficiente"
    objetivo: "Saber si las descripciones dieron suficiente información para imaginar el lugar y si repetían cosas."
    guion_investigador: 'Pregunte, pensando en todas las descripciones: "¿Le dieron suficiente información para imaginarse el lugar?" y "¿Sintió que repetían cosas?". Lea las opciones: 1 nada, 2 poco, 3 más o menos, 4 bastante, 5 mucho. Después pregunte: "¿Qué le faltó o qué le sobró?".'
    tipo: escala
    criterios: [suficiencia, redundancia]
    codificacion: []
    metricas: [M-USR-SUBJ]
    metricas_texto: ["información suficiente", "sensación de repetición"]
    tipo_evaluacion: usuario_subjetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
  - id: OBJ-07
    pista: objetivo
    nombre: "Utilidad"
    objetivo: "Conocer qué tan útiles le parecen las descripciones para moverse en un lugar que no conoce."
    guion_investigador: 'Pregunte: "¿Qué tan útil le parecería una descripción así para moverse en un lugar que no conoce?" y lea las opciones: 1 nada, 2 poco, 3 más o menos, 4 bastante, 5 mucho. Después pregunte: "¿Por qué?".'
    tipo: escala
    criterios: [utilidad_general]
    codificacion: []
    metricas: [M-USR-SUBJ]
    metricas_texto: ["utilidad percibida"]
    tipo_evaluacion: usuario_subjetiva
    estimulos: POR_DEFINIR
    disponibilidad: {investigador: true, participante: false}
