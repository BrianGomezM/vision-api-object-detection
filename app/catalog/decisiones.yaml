# Tareas de DECISIÓN (tipo C) del estudio con usuarios — Objetivo Específico 3.
#
# Qué evalúan: el participante escucha la narrativa de la API y elige entre
# alternativas. Es una decisión HIPOTÉTICA basada en información espacial auditiva:
# nadie camina, se desplaza ni controla un personaje (doc. 27, §H).
#
# Por qué está fuera de catalog.yaml: catalog.yaml está congelado (sha256 en
# experimental_config.yaml). Este archivo no cambia la detección, la narrativa ni el
# TTS; solo define cómo se registra y se compara la decisión.
#
# La alternativa ESPERADA vive solo aquí, en el servidor. GET /api/catalog publica la
# pregunta y las alternativas, nunca la respuesta esperada, para no sesgar al
# investigador. El servidor la aplica al guardar la respuesta: el cliente no la decide.
#
# pregunta / alternativas: las del guion del catálogo (revisado el 2026-10-01). No se
# añaden alternativas nuevas.
# esperada_por_estimulo: {stimulus_id: alternativa}. Los estímulos de OBJ-03/OBJ-04 se
# asignan en asignaciones.yaml (decisión del investigador del 2026-09-29, pendiente de
# revisión de los directores). La esperada sale del DISEÑO geométrico del manifest,
# no de lo que dijo el sistema:
#   DS1-C2: sofá al centro, planta a la derecha, nada a la izquierda → izquierda.
#   DS1-B2: sofá a la izquierda, planta a la derecha, centro despejado → frente.
#
# CAPAS (2026-10-01, doc. 34). La esperada de este archivo es la referencia de la ESCENA.
# El servidor extrae además la dirección que INDICÓ la narrativa (instrucción de movimiento)
# y registra por separado: participante vs. narrativa (comprensión, métrica principal),
# participante vs. escena y narrativa vs. escena (resultado técnico del sistema). En una
# corrida local (2026-10-01) el sistema indicó «frente» en DS1-C2: el sofá está a distancia
# media y no bloquea el espacio inmediato. Esa discrepancia es un resultado del sistema, no
# un error del participante.

schema_version: 1

# Estudio v2 (2026-10-10): escenas E3 y E4 (stimuli/estudio2). El participante puede decir
# VARIAS direcciones; la referencia de la escena es la lista de direcciones LIBRES según el
# diseño geométrico (solo cuentan los obstáculos cercanos):
#   EST2-E3: sofá cerca al frente y silla cerca a la derecha → solo la izquierda está libre.
#   EST2-E4: misma sala; la silla pasó a la izquierda → solo la derecha está libre.
# En la revisión previa (scripts/study/check_scenes.py, 2026-10-10) la narrativa indicó
# «izquierda» en E3 y «derecha» en E4, igual que el diseño.
tareas:
  - prueba_id: OBJ-03
    pregunta: "Según lo que escuchó, ¿por dónde podría avanzar sin chocar: por la izquierda, al frente o por la derecha? Puede decir más de una."
    alternativas:
      - {id: izquierda, texto: "Por la izquierda"}
      - {id: frente, texto: "Al frente"}
      - {id: derecha, texto: "Por la derecha"}
    esperada_por_estimulo: {EST2-E3: [izquierda]}
  - prueba_id: OBJ-04
    pregunta: "Y ahora, ¿por dónde podría avanzar sin chocar: por la izquierda, al frente o por la derecha? Puede decir más de una."
    alternativas:
      - {id: izquierda, texto: "Por la izquierda"}
      - {id: frente, texto: "Al frente"}
      - {id: derecha, texto: "Por la derecha"}
    esperada_por_estimulo: {EST2-E4: [derecha]}

# Fixtures TÉCNICOS: solo verifican el mecanismo (seleccionada / esperada / correcto)
# en sesiones de prueba técnica (PTEST…) y en modo ENSAYO. No son estímulos del
# estudio, no son evidencia y nunca se aplican a participantes (P0X).
fixtures_tecnicos:
  - id: FIX-DEC-01
    prueba_id: OBJ-03
    stimulus_id: DS1-B3
    esperada: izquierda
    fundamento: >-
      Condición geométrica del diseño de DS1-B3 (stimuli/dataset1/manifest.yaml):
      persona al centro y botella a la derecha, sin objetos a la izquierda. Sirve solo
      para probar el registro; no es una respuesta metodológica de OBJ-03.
